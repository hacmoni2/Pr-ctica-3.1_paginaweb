<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Gatitos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff6f61;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 280px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            margin: 0 0 5px 0;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>¡Galería de Gatitos! 🐾</h1>
    <p>Una página sencilla llena de ternura felina.</p>

    <div class="gallery">
        <!-- Gatito 1 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="Gatito tierno">
            <div class="card-content">
                <h3>Minino Curioso</h3>
            </div>
        </div>

        <!-- Gatito 2 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=500&q=80" alt="Gatito descansando">
            <div class="card-content">
                <h3>Hora de Siesta</h3>
            </div>
        </div>

        <!-- Gatito 3 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=500&q=80" alt="Gatito juguetón">
            <div class="card-content">
                <h3>Mirada Tierna</h3>
            </div>
        </div>
    </div>

</body>
</html>
